name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same workflow before publishing, so a release can
  # only ship a commit that passed all of it, and publishes its artifact.
  workflow_call:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The exact floor (package.json engines) and the newest 22.x most users
        # run; Node 24 is covered by the quality job below.
        os: [ubuntu-latest]
        node: ["22.18.0", 22, 26]
        include:
          - os: windows-latest
            node: "22.18.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - name: Coverage gate (lines >= 80%)
        run: npm run test:coverage
      - name: Validate .mcpb manifest
        run: npx mcpb validate manifest.json
      # The bundled packages are devDependencies (npm installs none of them),
      # so --omit=dev would audit nothing: audit what the bundle inlines.
      - name: Audit (bundled packages)
        run: npm audit --json | node scripts/audit-bundle.ts
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Pack .mcpb bundle
        run: npx mcpb pack . anilist-mcp-server.mcpb
      # What release.yml publishes; also lets anyone install a PR's .mcpb by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/
            anilist-mcp-server.mcpb
          if-no-files-found: error
