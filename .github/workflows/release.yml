name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI (tests, lint, coverage, audit) on the tagged commit; its quality
  # job builds dist/ and the .mcpb that the publish job ships.
  ci:
    uses: ./.github/workflows/ci.yml

  # Holds the publishing credentials but runs no dependency code: no `npm ci`,
  # no build (package.json has no prepublishOnly), only the CI's artifact.
  # contents: write → create the GitHub Release + upload the .mcpb asset.
  # id-token: write → npm Trusted Publishing (OIDC) + MCP Registry login.
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24: npm 12 (installed below) needs ^24.15.0. No cache: nothing is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # A hand-pushed tag that doesn't match package.json would publish the
      # package.json version under the wrong tag. `npm version` always agrees.
      - name: Check tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      # Needs no packages: plain fetch against AniList.
      - name: Health-check upstream APIs (gate)
        run: npm run check:api
      # Use CHANGELOG.md as the single source of truth for release notes: extract
      # this version's section and feed it as the GitHub Release body.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes for $VERSION -----"; cat RELEASE_NOTES.md
          # Fail loudly instead of shipping an empty GitHub Release body — the
          # release workflow's CHANGELOG extraction step matches `## [$VERSION]`
          # verbatim; sync-version.ts renames the heading itself, but this is
          # the safety net for whatever slips past that (this exact failure
          # happened in 3 sibling repos on 2026-07-29 before that automation
          # existed everywhere).
          if [ ! -s RELEASE_NOTES.md ] || ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No CHANGELOG.md section found for '## [$VERSION]' — RELEASE_NOTES.md is empty. Check that CHANGELOG.md's heading was renamed from '## [Unreleased]'."
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: anilist-mcp-server.mcpb
          body_path: RELEASE_NOTES.md
      # Idempotency guard: npm rejects re-publishing an existing version outright,
      # which would otherwise abort this job before the MCP Registry steps below
      # ever run (e.g. a tag re-run, or a version published manually as a
      # one-time bootstrap before Trusted Publishing was configured).
      - name: Check if this version is already published to npm
        id: npm_check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "anilist-mcp-server@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted Publishing (OIDC): no token. Requires npm >= 11.5.1 and a
      # trusted publisher configured for this package on npmjs.com. Pin an
      # exact, verified-good version rather than relying on whatever ships
      # bundled with actions/setup-node — matches every other tool in this
      # workflow being pinned to an exact commit/tag (checkout/setup-node/
      # gh-release above). npm 12.0.0 shipped a broken provenance path
      # ("Cannot find module 'sigstore'", npm/cli#9722); fixed in 12.0.1
      # (npm/cli#9740, released 2026-07-10). 12.2.3 was npm's `latest` dist-tag
      # on 2026-11-27 (`npm view npm version`).
      - name: Install npm for trusted publishing
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm install -g npm@12.2.3
      - name: Publish to npm (trusted publishing + provenance)
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --provenance --access public
      # The MCP Registry fetches this exact npm version, and a just-published one
      # can 404 for a few seconds (steam-games-mcp v0.15.0 was rejected one
      # second after publishing). Wait up to 2 min for npm to serve it.
      - name: Wait for the npm version to be visible
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 24); do
            if npm view "anilist-mcp-server@${PKG_VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "waiting for anilist-mcp-server@${PKG_VERSION} on npm (${i}/24)…"
            sleep 5
          done
          echo "::error::anilist-mcp-server@${PKG_VERSION} is not visible on npm after 2 min"
          exit 1

      # Publish to the official MCP Registry (registry.modelcontextprotocol.io).
      # Runs after npm publish so the npm package (with its mcpName marker) is
      # live for the registry's ownership check. The mcpb entry's fileSha256 is
      # injected from the just-packed bundle so it always matches the release
      # asset (zip mtimes make .mcpb non-reproducible, so a committed hash drifts).
      - name: Inject .mcpb SHA-256 into server.json
        run: |
          SHA=$(sha256sum anilist-mcp-server.mcpb | cut -d' ' -f1)
          jq --arg sha "$SHA" \
            '(.packages[] | select(.registryType=="mcpb")).fileSha256 = $sha' \
            server.json > server.json.tmp && mv server.json.tmp server.json
          # jq's select() silently no-ops (exit 0, document unchanged) if no
          # package has registryType=="mcpb" — this would publish a stale/missing
          # fileSha256 to the MCP Registry with no error anywhere. Verify the
          # injection actually took instead of trusting jq's exit code.
          GOT="$(jq -r '.packages[] | select(.registryType=="mcpb") | .fileSha256' server.json)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::Failed to inject fileSha256 into server.json — no package with registryType==\"mcpb\" found, or the update didn't take. Got: '$GOT', expected: '$SHA'"
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          # Pinned to an exact version + checksum rather than "latest" — this step
          # runs with live OIDC publishing credentials, so an unpinned/unverified
          # binary here would be the one weak link in an otherwise fully pinned
          # pipeline (actions pinned to commit SHAs, npm pinned to an exact
          # version above). This job only ever runs on ubuntu-latest, so the
          # linux_amd64 asset is the only one that matters. To bump: download the
          # new version's mcp-publisher_linux_amd64.tar.gz from
          # https://github.com/modelcontextprotocol/registry/releases, `sha256sum`
          # it, and update both constants below.
          MCP_PUBLISHER_VERSION="v1.8.16"
          MCP_PUBLISHER_SHA256="6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05"
          curl -sL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
