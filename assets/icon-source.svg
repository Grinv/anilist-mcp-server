<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- anilist-mcp-server icon — original vector design source.

       IMPORTANT: rendering this file through a naive SVG->PNG pipeline (a
       browser screenshot, macOS Quick Look's SVG thumbnailer, etc.) loses
       the transparent background — both silently composite against opaque
       white regardless of this file's lack of a background rect, even
       though the official MCPB icon spec requires "PNG with transparency".
       The actual rasterization to assets/icon.png happens in
       generate-icon.py, which draws the same shape directly with Pillow
       (supersampled + downsampled for anti-aliasing) and produces real
       per-pixel alpha. Keep this file and generate-icon.py in sync by hand
       if you ever edit one — there is no automated link.

       Shape: an original, generic "kawaii creature" head — a round face
       with two pointed (cat/fox-like) ears (navy inner-ear accent for
       depth), a navy belly highlight, and simple dot eyes, evoking
       anime-mascot cuteness in general, not any specific copyrighted
       character (no belly *markings*/pattern, no whiskers, no
       character-specific proportions). Deliberately distinct from the
       sibling mal-mcp icon's round bear/mouse ears + flat single-tone color
       — here the ears are pointed and there's a second accent color, so
       the two read as different creatures even though both are anime-list
       trackers.

       Colors are AniList's own real brand colors, pulled directly from
       their official logo SVG
       (upload.wikimedia.org/wikipedia/commons/6/61/AniList_logo.svg) —
       verified live 2026-07-29, not guessed from memory: #02a9ff (cyan,
       their primary accent), #1e2630 (navy, their background tone — used
       here as an inner-ear/belly accent, not a filled background tile),
       #fefefe (off-white, their mark color). Ear corners are rounded via a
       same-color stroke with a round linejoin (the same trick tmdb-mcp's
       icon uses), since <polygon> has no native corner radius. -->
  <polygon points="120,232 232,176 168,96"
           fill="#02a9ff" stroke="#02a9ff" stroke-width="56"
           stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="392,232 280,176 344,96"
           fill="#02a9ff" stroke="#02a9ff" stroke-width="56"
           stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="256" cy="306" r="148" fill="#02a9ff"/>
  <polygon points="148,214 222,178 178,128"
           fill="#1e2630" stroke="#1e2630" stroke-width="26"
           stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="364,214 290,178 334,128"
           fill="#1e2630" stroke="#1e2630" stroke-width="26"
           stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="256" cy="378" rx="84" ry="58" fill="#1e2630"/>
  <circle cx="206" cy="296" r="20" fill="#fefefe"/>
  <circle cx="306" cy="296" r="20" fill="#fefefe"/>
</svg>
